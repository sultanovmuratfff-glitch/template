[build-system]
requires = [
    "scikit-build-core>=0.8.0",
    "setuptools>=65.0",
    "wheel>=0.40",
    "nanobind>=2.0.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "viscopuppy"
version = "0.1.0"
description = "A high-performance Python library built from modern C++23 code"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
maintainers = [
    {name = "Your Name", email = "your.email@example.com"},
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "build>=1.0",
    "twine>=4.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=2.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/viscopuppy"
Repository = "https://github.com/yourusername/viscopuppy"
Documentation = "https://yourusername.github.io/viscopuppy"
Changelog = "https://github.com/yourusername/viscopuppy/releases"
Issues = "https://github.com/yourusername/viscopuppy/issues"
[tool.scikit-build]
experimental = true
wheel.packages = ["python/viscopuppy"]
wheel.install-dir = "python/viscopuppy"
wheel.py-api = "cp39"


cmake.args = [
    "-DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake",
    "-DCMAKE_CXX_STANDARD=23",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DCMAKE_CXX_EXTENSIONS=OFF",
    "-DCMAKE_POSITION_INDEPENDENT_CODE=ON",
    "-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON",
]
cmake.define.NANOBIND_BUILD_TESTS = "OFF"
cmake.define.VISCOPUPPY_USE_CONAN = "ON"
cmake.define.VISCOPUPPY_BUILD_PYTHON = "ON"
cmake.define.CONAN_PROFILE = "default"
cmake.build-type = "Release"
cmake.verbose = false

# Build configuration
build-dir = "build"
minimum-version = "0.8.0"

# Editable installs
editable.mode = "redirect"


[tool.scikit-build.sdist]
include = [
    "CMakeLists.txt",
    "src/**/*",
    "include/**/*",
    "tests/**/*",
    "python/**/*",
    "examples/**/*",
    "scripts/**/*",
    ".clang-format",
    ".clang-tidy",
    ".pre-commit-config.yaml",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py39"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]
exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "venv",
]

[tool.ruff.isort]
known-first-party = ["viscopuppy"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "viscopuppy.*",
    "tests.*",
]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["python/tests", "tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["viscopuppy"]

[tool.setuptools.package-data]
viscopuppy = ["py.typed", "*.pyi"]