repos:
  # Python code formatting with black
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3
        args: ["--config", "pyproject.toml"]
        files: ^python/.*\.py$
  
  # Python linting with ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--config", "pyproject.toml", "--fix"]
        files: ^python/.*\.py$
      - id: ruff-format
        files: ^python/.*\.py$
  
  # Python type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: ["--config-file", "pyproject.toml"]
        files: ^python/.*\.py$
        additional_dependencies:
          - numpy
          - pytest
  
  # C++ code formatting with clang-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types: [file]
        files: \.(cpp|hpp|c|h|cc|hh|cxx|hxx)$
        exclude: ^(build|\.venv|third_party|external)/
        args: ["-i", "--style=file:.clang-format"]
  
  # C++ linting with clang-tidy
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.5.1
    hooks:
      - id: clang-tidy
        args: ["-p", "build", "--config-file=.clang-tidy"]
        files: \.(cpp|hpp|c|h|cc|hh|cxx|hxx)$
        exclude: ^(build|\.venv|third_party|external)/
        pass_filenames: false
  
  # CMake formatting with cmake-format
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        files: CMakeLists\.txt$|\.cmake$
        args: ["-i"]
  
  # CMake linting with cmake-lint
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-lint
        files: CMakeLists\.txt$|\.cmake$
  
  # Shell script linting with shellcheck
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: \.(sh|bash)$
        args: ["--severity=warning"]
  
  # YAML linting with yamllint
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["--config-file", ".yamllint"]
        files: \.(yaml|yml)$
  
  # TOML linting with taplo
  - repo: https://github.com/tamasfe/taplo
    rev: 0.9.3
    hooks:
      - id: taplo-fmt
        files: \.(toml)$
  
  # Markdown linting with markdownlint
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.json"]
        files: \.md$
  
  # End of file fixer
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: mixed-line-ending
        args: ["--fix=lf"]
  
  # Git commit message linting
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.16.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]