name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  BUILD_TYPE: Release

jobs:
  run_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            python3-dev \
            libpython3-dev

      - name: Install Conan and create matching profile
        run: |
          pip install conan
          conan profile detect --force --name=default
          # Match your local profile (except compiler version, which is detected)
          echo "[settings]
          arch=x86_64
          build_type=Release
          compiler=gcc
          compiler.cppstd=gnu23
          compiler.libcxx=libstdc++11
          compiler.version=13
          os=Linux" > ~/.conan2/profiles/default

      - name: Create build directory and run conan install
        run: |
          conan install . \
            --output-folder=. \
            --build=missing \
            -s build_type=Release

      - name: Configure CMake for C++ tests
        run: |
          cd build/Release
          cmake ../.. \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=./generators/conan_toolchain.cmake \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -G "Unix Makefiles"

      - name: Build C++ tests
        run: |
          cd build/Release
          make -j$(nproc)

      - name: Install uv (fast Python package installer)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Setup Python environment and install package
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e .[dev]

      - name: Run C++ tests
        run: |
          cd build/Release
          ctest --output-on-failure

      - name: Run Python tests
        run: |
          source .venv/bin/activate
          python -m pytest python/tests/ -v