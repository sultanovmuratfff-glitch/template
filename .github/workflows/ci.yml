name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  BUILD_TYPE: Release

jobs:
  run_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            python3-dev \
            libpython3-dev

      - name: Install Conan and create matching profile
        run: |
          pip install conan
          conan profile detect --force --name=default
          echo "[settings]
          arch=x86_64
          build_type=Release
          compiler=gcc
          compiler.cppstd=gnu23
          compiler.libcxx=libstdc++11
          compiler.version=13
          os=Linux" > ~/.conan2/profiles/default

      - name: Conan install and build project
        run: |
          conan install . \
            --output-folder=. \
            --build=missing \
            -o with_tests=True \
            -s build_type=Release

      - name: Install uv (fast Python package installer)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Setup Python environment and install package
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e .[dev]

      - name: Run C++ tests
        run: |
          build/Release/bin/test

      - name: Run Python tests
        run: |
          source .venv/bin/activate
          python -m pytest python/tests/ -v